name: Docker Hello

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker
        run: docker --version

      - name: Build Docker image
        run: docker build -t hello-docker ./01-docker-hello

      - name: List Docker images
        run: docker images

      - name: Run Docker container
        run: docker run --rm hello-docker
